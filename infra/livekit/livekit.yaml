# LiveKit server config for local QAV development.
# Docs: https://docs.livekit.io/home/self-hosting/deployment/
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: false
keys:
  devkey: secret
logging:
  level: info
room:
  auto_create: true
  empty_timeout: 300
  departure_timeout: 20
