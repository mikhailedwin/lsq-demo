[project]
name = "qav-engine"
version = "0.1.0"
description = "QAV conversation engine + face renderer (LiveKit Agents worker)"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[anthropic,cartesia,deepgram,elevenlabs,openai,silero]~=1.8",
    "qav-face",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[tool.uv.sources]
qav-face = { path = "../face", editable = true }

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
qav-engine = "qav_engine.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qav_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
