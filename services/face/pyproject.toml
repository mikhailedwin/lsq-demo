[project]
name = "qav-face"
version = "0.1.0"
description = "QAV face renderer: turns a persona's speech audio into lip-synced video (CPU placeholder + GPU neural backends)"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents~=1.8",
    "numpy>=1.23",
    "pillow>=10.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# MuseTalk 1.5 (photoreal lip-sync on a real video clip). Needs an NVIDIA GPU
# and the MuseTalk repo checkout at $MUSETALK_ROOT — see Dockerfile.musetalk.
musetalk = [
    "torch>=2.2",
    "torchvision",
    "diffusers==0.30.2",
    "transformers==4.39.2",
    "accelerate==0.28.0",
    "opencv-python-headless>=4.9",
    "librosa>=0.10",
    "einops>=0.8",
    "omegaconf",
    "imageio[ffmpeg]",
]
# Live Avatar (Alibaba, Wan2.2-S2V-14B + LoRA). 80 GB GPU (48 GB with FP8).
# Uses the LiveAvatar repo checkout at $LIVEAVATAR_ROOT — see Dockerfile.liveavatar.
liveavatar = [
    "torch>=2.8",
    "torchvision",
    "diffusers>=0.31",
    "transformers>=4.49,<=4.51.3",
    "peft==0.17.1",
    "easydict",
    "einops",
    "librosa",
    "imageio[ffmpeg]",
    "opencv-python-headless",
    "huggingface_hub",
    "safetensors",
]

[project.scripts]
qav-face = "qav_face.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qav_face"]

[tool.pytest.ini_options]
testpaths = ["tests"]
