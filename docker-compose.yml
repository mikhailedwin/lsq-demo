services:
  # WebRTC SFU. Browsers, the engine, and the avatar renderer all meet here.
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml --node-ip 127.0.0.1
    network_mode: host
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro

  # Control plane: personas, session tokens, engine sessions.
  api:
    build: ./apps/api
    env_file: .env
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
    network_mode: host
    depends_on:
      - livekit

  # Conversation engine + face renderer (LiveKit Agents worker).
  engine:
    build: ./services/engine
    env_file: .env
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
    network_mode: host
    depends_on:
      - livekit
