services:
  # WebRTC SFU. Browsers, the engine, and the face renderer all meet here.
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml --node-ip 127.0.0.1
    network_mode: host
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro

  # Control plane: personas, session tokens, engine sessions.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
    network_mode: host
    depends_on:
      - livekit

  # Conversation engine (STT → LLM → TTS). Runs the CPU placeholder face
  # in-process; GPU faces are dispatched to the qav-face worker instead
  # (see docker-compose.gpu.yml).
  engine:
    build:
      context: .
      dockerfile: services/engine/Dockerfile
    env_file: .env
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
    network_mode: host
    depends_on:
      - livekit
